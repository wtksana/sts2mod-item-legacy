## Item Legacy 配置
## 修改后需要重启游戏才会生效。

[Cards]

## 是否启用卡牌遗产。
# Setting type: Boolean
# Default value: true
Enabled = true

## 卡牌遗产是否继承上一局的升级和附魔。
## false：继承同名未升级卡牌。
## true：保留上一局卡牌升级等级。
# Setting type: Boolean
# Default value: false
InheritUpgrades = false

## 卡牌遗产是否继承上一局的附魔。
## false：不继承附魔。
## true：保留上一局卡牌附魔和附魔保存属性。
# Setting type: Boolean
# Default value: false
InheritEnchantments = false

[Potions]

## 是否启用药水遗产。
# Setting type: Boolean
# Default value: true
Enabled = true

[Relics]

## 是否启用遗物遗产。
# Setting type: Boolean
# Default value: true
Enabled = true

## 允许继承的遗物种类，使用英文枚举名，多个值用英文逗号分隔。
## 可用值：
## None = 无稀有度
## Starter = 初始
## Common = 普通
## Uncommon = 罕见
## Rare = 稀有
## Shop = 商店
## Event = 事件
## Ancient = 远古
## 也可以填 All 允许所有种类。
# Setting type: String
# Default value: Common, Uncommon, Rare, Shop
InheritableRarities = Common, Uncommon, Rare, Shop

[Gold]

## 是否启用金币遗产。
## true 时会把上一局结束保留的金币作为一个可跳过奖励。
# Setting type: Boolean
# Default value: false
Enabled = false
