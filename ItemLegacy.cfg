## Item Legacy 配置
## 修改后需要重启游戏才会生效。

[Cards]

## 卡牌遗产是否继承上一局的升级和附魔。
## false：只继承同名基础版卡牌。
## true：继承升级等级、附魔和保存属性。
# Setting type: Boolean
# Default value: false
InheritUpgradesAndEnchantments = false

[Relics]

## 遗物遗产是否允许继承所有种类的遗物。
## false：只继承普通、罕见、稀有、商店遗物。
## true：允许上一局历史中的所有遗物种类进入候选。
# Setting type: Boolean
# Default value: false
InheritAllRarities = false
